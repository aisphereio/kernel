name: framework-boundary-hardening

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify module graph is committed
        shell: bash
        run: |
          set -euxo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Targeted framework tests
        shell: bash
        run: |
          set -euxo pipefail
          go test ./dbx ./dbrepo ./migrationx ./serverx -count=1
          go test ./cmd/protoc-gen-go-gateway ./cmd/protoc-gen-go-kernel ./cmd/protoc-gen-go-authz ./cmd/protoc-gen-go-http ./cmd/buf-check-aisphere -count=1

      - name: Build generators and regenerate API
        shell: bash
        run: |
          set -euxo pipefail
          make tools
          make api
          make proto-check

      - name: Compile generated contract surface
        shell: bash
        run: |
          set -euxo pipefail
          go test ./api/... ./serverx ./gatewayx ./requestx ./accessx ./authn ./authz -count=1

      - name: Generate a real service with kernel new
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/kernel-layout" "$RUNNER_TEMP/kernel-generated"
          git clone --depth 1 https://github.com/aisphereio/kernel-layout.git "$RUNNER_TEMP/kernel-layout"
          mkdir -p "$RUNNER_TEMP/kernel-generated"
          "$GITHUB_WORKSPACE/.bin/kernel" new "$RUNNER_TEMP/kernel-generated/boundary-smoke" \
            --repo "$RUNNER_TEMP/kernel-layout" \
            --kernel-version dev \
            --timeout 180s

      - name: Verify generated service against this Kernel commit
        shell: bash
        working-directory: ${{ runner.temp }}/kernel-generated/boundary-smoke
        run: |
          set -euxo pipefail
          go mod edit -replace github.com/aisphereio/kernel="$GITHUB_WORKSPACE"
          go mod tidy
          make tools-local KERNEL_LOCAL="$GITHUB_WORKSPACE"
          make verify KERNEL_LOCAL="$GITHUB_WORKSPACE"

      - name: Build source bundle
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar --exclude=.git --exclude=.bin -czf /tmp/kernel-framework-boundary-code.tgz .

      - name: Upload source bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-framework-boundary-code
          path: /tmp/kernel-framework-boundary-code.tgz
          if-no-files-found: error
          retention-days: 7
